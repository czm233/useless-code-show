<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矩阵代码雨 - 无用代码画廊</title>
  <style>
    /* 全局重置 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // ==================== 矩阵代码雨效果 ====================
    // 经典黑客帝国风格的绿色字符瀑布
    // 使用 Canvas API 实现，带随机闪烁和亮度变化

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 设备像素比
    const dpr = window.devicePixelRatio || 1;
    let width, height;

    /** 调整画布尺寸 */
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      // 重新初始化列数据
      initColumns();
    }

    // ==================== 配置参数 ====================
    const FONT_SIZE = 16;             // 字符大小
    const FADE_ALPHA = 0.05;          // 淡出速度（越小拖尾越长）
    const BASE_SPEED_MIN = 0.6;       // 最小下落速度
    const BASE_SPEED_MAX = 1.5;       // 最大下落速度
    const CHAR_CHANGE_RATE = 0.03;    // 字符随机变化概率

    // 使用的字符集：日文片假名 + 拉丁字母 + 数字
    const CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    /** 随机获取一个字符 */
    function randomChar() {
      return CHARS[Math.floor(Math.random() * CHARS.length)];
    }

    // ==================== 列数据 ====================
    let columns = [];
    const columnWidth = FONT_SIZE;

    /** 初始化每列的状态 */
    function initColumns() {
      const colCount = Math.ceil(width / columnWidth);
      // 保留已有的列数据，新增的列从头开始
      const newColumns = [];
      for (let i = 0; i < colCount; i++) {
        if (columns[i]) {
          newColumns.push(columns[i]);
        } else {
          newColumns.push(createColumn());
        }
      }
      columns = newColumns;
    }

    /** 创建一个新列 */
    function createColumn() {
      return {
        y: Math.random() * -height,   // 初始 y 偏移（负数，随机起始位置）
        speed: Math.random() * (BASE_SPEED_MAX - BASE_SPEED_MIN) + BASE_SPEED_MIN,
        chars: [],                     // 当前列的字符数组
        length: Math.floor(Math.random() * 25) + 10,  // 字符串长度
        brightness: 0.7 + Math.random() * 0.3,        // 亮度
      };
    }

    // 初始化
    resize();
    window.addEventListener('resize', resize);

    // ==================== 绘制函数 ====================

    /** 绘制单列字符雨 */
    function drawColumn(col, x) {
      const headY = col.y;

      // 绘制每个字符
      for (let j = 0; j < col.length; j++) {
        const charY = headY - j * FONT_SIZE;

        // 跳过屏幕外的字符
        if (charY < -FONT_SIZE || charY > height + FONT_SIZE) continue;

        // 随机更换字符
        if (Math.random() < CHAR_CHANGE_RATE) {
          // 字符会在绘制时随机生成，这里不需要缓存
        }

        // 计算透明度：头部最亮，越往后越暗
        let alpha;
        if (j === 0) {
          // 头部字符：白色到亮绿色
          alpha = 1.0;
          ctx.fillStyle = `rgba(180, 255, 180, ${alpha})`;
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur = 15;
        } else if (j < 3) {
          // 靠近头部的字符：亮绿色
          alpha = col.brightness * (1 - j * 0.15);
          ctx.fillStyle = `rgba(0, 255, 65, ${alpha})`;
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur = 8;
        } else {
          // 尾部字符：逐渐变暗
          alpha = col.brightness * Math.max(0, 1 - j / col.length);
          const green = Math.floor(180 + 75 * (1 - j / col.length));
          ctx.fillStyle = `rgba(0, ${green}, 20, ${alpha})`;
          ctx.shadowBlur = 0;
        }

        ctx.font = `${FONT_SIZE}px monospace`;
        ctx.fillText(randomChar(), x, charY);
        ctx.shadowBlur = 0;
      }
    }

    // ==================== 动画循环 ====================
    function animate() {
      // 半透明黑色覆盖，产生拖尾淡出效果
      ctx.fillStyle = `rgba(0, 0, 0, ${FADE_ALPHA})`;
      ctx.fillRect(0, 0, width, height);

      // 绘制并更新每一列
      for (let i = 0; i < columns.length; i++) {
        const col = columns[i];
        const x = i * columnWidth;

        drawColumn(col, x);

        // 更新列的 y 位置
        col.y += col.speed * FONT_SIZE;

        // 如果列的头部完全离开屏幕底部，重置到顶部
        if (col.y - col.length * FONT_SIZE > height) {
          columns[i] = createColumn();
          columns[i].y = Math.random() * -200;
        }
      }

      requestAnimationFrame(animate);
    }

    // 启动动画
    animate();
  </script>
</body>
</html>
