<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人类灵魂图灵验证协议 - 无用代码画廊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #2563eb;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .captcha-box {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
    }
    .step-tag {
      font-size: 12px;
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .prompt-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }
    /* 九宫格 */
    .grid-9 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .grid-item {
      aspect-ratio: 1;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: all 0.2s;
    }
    .grid-item:hover {
      border-color: var(--primary);
    }
    .grid-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .grid-item.selected::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 憋气长按 */
    .breath-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }
    .breath-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      background: #eff6ff;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform 0.1s;
      outline: none;
    }
    .breath-btn:active {
      transform: scale(0.94);
      background: #dbeafe;
    }

    /* 底部操作 */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .btn-verify {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-verify:hover { background: #1d4ed8; }

    /* 错误/反差结果提示 */
    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="captcha-box">
    <div class="header-bar">
      <div class="brand">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 6v6l4 2"></path>
        </svg>
        <span>TURING-SOUL 灵魂认证</span>
      </div>
      <span class="step-tag" id="stepTag">阶段 1 / 2</span>
    </div>

    <!-- 题目说明 -->
    <div class="prompt-text" id="promptText">
      请在下方九宫格中，点击选中所有包含【强烈渴望立刻下班的眼神】的图像：
    </div>

    <!-- 阶段 1：九宫格表情 -->
    <div class="grid-9" id="grid9">
      <div class="grid-item"><span>😴</span><span class="grid-desc">双目无光</span></div>
      <div class="grid-item"><span>🫠</span><span class="grid-desc">融化打工</span></div>
      <div class="grid-item"><span>💀</span><span class="grid-desc">灵魂出窍</span></div>
      <div class="grid-item"><span>🥱</span><span class="grid-desc">极度犯困</span></div>
      <div class="grid-item"><span>🥹</span><span class="grid-desc">眼含热泪</span></div>
      <div class="grid-item"><span>🥴</span><span class="grid-desc">神志不清</span></div>
      <div class="grid-item"><span>🤡</span><span class="grid-desc">自嘲小丑</span></div>
      <div class="grid-item"><span>🙃</span><span class="grid-desc">勉强微笑</span></div>
      <div class="grid-item"><span>✨</span><span class="grid-desc">充满激情</span></div>
    </div>

    <!-- 阶段 2：碳基憋气测试 -->
    <div class="breath-box" id="breathBox">
      <p style="font-size: 13px; color: var(--text-muted); text-align: center;">
        请长按下方圆形按钮憋气 3 秒，以证明您具备碳基生物由于缺氧引发的生理焦虑：
      </p>
      <button class="breath-btn" id="breathBtn">
        <span id="breathTime">3.0s</span>
        <span style="font-size: 11px; font-weight: normal;">按住不放</span>
      </button>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="footer-bar">
      <span style="font-size: 11px; color: var(--text-muted);">Privacy • Terms</span>
      <button class="btn-verify" id="btnVerify">下一步验证</button>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const gridItems = document.querySelectorAll('.grid-item');
    const btnVerify = document.getElementById('btnVerify');
    const errorBox = document.getElementById('errorBox');
    const promptText = document.getElementById('promptText');
    const grid9 = document.getElementById('grid9');
    const breathBox = document.getElementById('breathBox');
    const stepTag = document.getElementById('stepTag');
    const breathBtn = document.getElementById('breathBtn');
    const breathTime = document.getElementById('breathTime');

    gridItems.forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('selected');
      });
    });

    btnVerify.addEventListener('click', () => {
      if (currentStep === 1) {
        // 第一阶段判定
        errorBox.style.display = 'none';
        currentStep = 2;
        stepTag.textContent = '阶段 2 / 2';
        promptText.textContent = '【阶段 2】碳基生物微量摄氧特征验证';
        grid9.style.display = 'none';
        breathBox.style.display = 'flex';
        btnVerify.style.display = 'none';
      }
    });

    // 憋气测试逻辑
    let holdTimer = null;
    let holdDuration = 3.0;

    breathBtn.addEventListener('mousedown', startHold);
    breathBtn.addEventListener('touchstart', startHold);
    window.addEventListener('mouseup', cancelHold);
    window.addEventListener('touchend', cancelHold);

    function startHold(e) {
      e.preventDefault();
      holdDuration = 3.0;
      errorBox.style.display = 'none';
      holdTimer = setInterval(() => {
        holdDuration -= 0.1;
        breathTime.textContent = `${Math.max(0, holdDuration).toFixed(1)}s`;
        if (holdDuration <= 0) {
          clearInterval(holdTimer);
          failVerdict();
        }
      }, 100);
    }

    function cancelHold() {
      if (holdTimer) {
        clearInterval(holdTimer);
        holdTimer = null;
        if (holdDuration > 0) {
          breathTime.textContent = '3.0s';
          errorBox.textContent = '提示：憋气中断！真正的人类在下班前总能憋住任何委屈，请重新长按。';
          errorBox.style.display = 'block';
        }
      }
    }

    function failVerdict() {
      breathBox.style.display = 'none';
      errorBox.innerHTML = `
        <strong>🚨 验证未通过：系统判定您为仿生人！</strong><br>
        系统检测到您在周中工作日依然眼神清澈、脉搏稳定，缺乏真实人类打工人的颓废与疲惫感。<br><br>
        <strong>处罚结果：</strong>您的打卡权限已被封禁 24 小时，已被开除人类籍。
      `;
      errorBox.style.display = 'block';
      promptText.textContent = '图灵灵魂协议裁决：认证失败';
    }
  </script>
</body>
</html>
