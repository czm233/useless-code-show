<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无用按钮 - 无用代码画廊</title>
  <style>
    /* 全局样式 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a0a2e;
      /* 背景微光效果 */
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(162, 155, 254, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(108, 92, 231, 0.1) 0%, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* 顶部提示文字 */
    .hint {
      color: rgba(162, 155, 254, 0.5);
      font-size: 14px;
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 无用按钮本体 */
    .useless-btn {
      position: relative;
      padding: 24px 64px;
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      outline: none;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow:
        0 8px 32px rgba(108, 92, 231, 0.4),
        0 0 0 0 rgba(162, 155, 254, 0);
      user-select: none;
      min-width: 260px;
    }

    /* 悬停效果 */
    .useless-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 12px 40px rgba(108, 92, 231, 0.5),
        0 0 60px rgba(162, 155, 254, 0.2);
    }

    /* 按下效果 */
    .useless-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow:
        0 4px 16px rgba(108, 92, 231, 0.3),
        0 0 0 0 rgba(162, 155, 254, 0);
    }

    /* 点击时的脉冲动画 */
    .useless-btn.clicked {
      animation: pulse 0.4s ease-out;
    }

    @keyframes pulse {
      0% { box-shadow: 0 8px 32px rgba(108, 92, 231, 0.4), 0 0 0 0 rgba(162, 155, 254, 0.6); }
      100% { box-shadow: 0 8px 32px rgba(108, 92, 231, 0.4), 0 0 0 40px rgba(162, 155, 254, 0); }
    }

    /* 文字变化动画 */
    .useless-btn.text-change {
      animation: textPop 0.3s ease-out;
    }

    @keyframes textPop {
      0% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 点击计数器 */
    .counter {
      margin-top: 40px;
      color: rgba(162, 155, 254, 0.3);
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .counter.visible {
      color: rgba(162, 155, 254, 0.6);
    }

    /* 底部版权 */
    .footer {
      position: fixed;
      bottom: 20px;
      color: rgba(162, 155, 254, 0.2);
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* 背景浮动粒子 */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20px) scale(1); }
    }
  </style>
</head>
<body>
  <!-- 背景粒子容器 -->
  <div id="particles"></div>

  <p class="hint">试试看会发生什么</p>

  <button class="useless-btn" id="uselessBtn">点 我</button>

  <p class="counter" id="counter">你已经点了 0 次，然而什么也没发生</p>

  <p class="footer">USELESS BUTTON v1.0 -- 百分之百无用</p>

  <script>
    // ==================== 无用按钮逻辑 ====================
    // 点击按钮后文字随机变化，但什么也不会发生

    const btn = document.getElementById('uselessBtn');
    const counterEl = document.getElementById('counter');
    let clickCount = 0;

    // 点击后可能显示的文字列表
    const texts = [
      '没用吧？',
      '再试试？',
      '放弃吧',
      '真的没用',
      '说了没用',
      '还不信？',
      '继续点...',
      '有意思吗',
      '我就不变',
      '好吧好吧',
      '...又点了',
      '累不累？',
      '认真没用',
      '骗你的',
      '还是没用',
      '你赢了',
      '并没有',
      '无聊吧',
      '确实没用',
      '下次一定',
      '已读不回',
      '已放弃',
      '别点了我求你',
      '我真的尽力了',
      '这按钮有bug',
    ];

    /** 随机获取一条文字 */
    function getRandomText() {
      let text;
      do {
        text = texts[Math.floor(Math.random() * texts.length)];
      } while (text === btn.textContent);  // 避免连续显示相同文字
      return text;
    }

    /** 按钮点击事件 */
    btn.addEventListener('click', function () {
      clickCount++;

      // 更新按钮文字
      btn.textContent = getRandomText();

      // 添加动画效果
      btn.classList.remove('clicked', 'text-change');
      // 触发重排以重新播放动画
      void btn.offsetWidth;
      btn.classList.add('clicked', 'text-change');

      // 更新计数器文字
      updateCounter();

      // 随机微调按钮颜色（增加趣味性）
      const hue = 250 + Math.random() * 30 - 15;
      btn.style.background = `linear-gradient(135deg, hsl(${hue}, 70%, 55%), hsl(${hue + 20}, 60%, 70%))`;
    });

    /** 更新计数器 */
    function updateCounter() {
      counterEl.classList.add('visible');

      if (clickCount === 1) {
        counterEl.textContent = '你已经点了 1 次，然而什么也没发生';
      } else if (clickCount < 10) {
        counterEl.textContent = `你已经点了 ${clickCount} 次，然而什么也没发生`;
      } else if (clickCount < 20) {
        counterEl.textContent = `你已经点了 ${clickCount} 次...执着的人`;
      } else if (clickCount < 50) {
        counterEl.textContent = `${clickCount} 次了，你真的很执着`;
      } else if (clickCount < 100) {
        counterEl.textContent = `${clickCount} 次！你是不是没事做？`;
      } else {
        counterEl.textContent = `${clickCount} 次...佩服你的毅力`;
      }
    }

    // ==================== 背景粒子效果 ====================
    const particlesContainer = document.getElementById('particles');

    /** 创建一个背景粒子 */
    function createParticle() {
      const particle = document.createElement('div');
      particle.className = 'particle';

      // 随机属性
      const size = Math.random() * 6 + 2;
      const x = Math.random() * 100;
      const duration = Math.random() * 8 + 6;
      const delay = Math.random() * 10;
      const hue = 250 + Math.random() * 40;

      particle.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${x}%;
        background: hsl(${hue}, 60%, 70%);
        box-shadow: 0 0 ${size * 2}px hsl(${hue}, 60%, 70%);
        animation-duration: ${duration}s;
        animation-delay: ${delay}s;
      `;

      particlesContainer.appendChild(particle);

      // 动画结束后移除并重新创建
      setTimeout(() => {
        particle.remove();
        createParticle();
      }, (duration + delay) * 1000);
    }

    // 创建一批初始粒子
    for (let i = 0; i < 20; i++) {
      createParticle();
    }
  </script>
</body>
</html>
