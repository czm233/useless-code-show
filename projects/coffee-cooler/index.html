<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手冲咖啡云端降温仪 - 无用代码画廊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #121214;
      --card: #1c1c20;
      --border: #2a2a30;
      --copper: #e07a5f;
      --cream: #f4f1de;
      --text: #eaeaea;
      --text-muted: #8e8e93;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1f1d24, #121214 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .instrument-shell {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      text-align: center;
      position: relative;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--copper);
      background: rgba(224, 122, 95, 0.12);
      border: 1px solid rgba(224, 122, 95, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 800;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 480px;
      line-height: 1.6;
    }

    /* 温度计圆盘 */
    .gauge-wrap {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 6px solid #2a2a32;
      border-top-color: var(--copper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #141416;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .temp-val {
      font-size: 38px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #fff;
    }
    .temp-unit {
      font-size: 13px;
      color: var(--copper);
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* 风扇动画 */
    .fan-indicator {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px dashed #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-top: 6px;
      transition: transform 0.2s;
    }
    .fan-spinning {
      animation: spinFan 0.15s infinite linear;
      border-color: var(--copper);
    }
    @keyframes spinFan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 启动按钮 */
    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cool {
      background: linear-gradient(135deg, #e07a5f, #c85a3c);
      color: #fff;
      border: none;
      box-shadow: 0 8px 25px rgba(224, 122, 95, 0.4);
    }
    .btn-cool:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .btn-cool:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-blow {
      background: transparent;
      border: 1px solid var(--border);
      color: #cbd5e1;
    }
    .btn-blow:hover {
      background: rgba(255,255,255,0.06);
    }

    /* 监控日志 */
    .status-log {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="instrument-shell">
    <span class="tag">THERMAL AERO DYNAMICS // v1.2</span>
    <h1>手冲咖啡云端对流降温仪</h1>
    <p class="sub">
      刚冲出的 94.0°C 单品咖啡太烫无法入口？将杯子放在笔记本电脑风扇出风口旁，本程序将调度 GPU 满载渲染驱动机身微风进行精准对流降温。
    </p>

    <div class="gauge-wrap">
      <div class="temp-val" id="tempVal">94.00</div>
      <div class="temp-unit">°C 实时杯温</div>
      <div class="fan-indicator" id="fanIcon">🌀</div>
    </div>

    <div class="btn-row">
      <button class="btn btn-cool" id="btnCool">启动 GPU 满载微气流降温</button>
      <button class="btn btn-blow" id="btnBlow">直接用嘴吹一吹 (平民方案)</button>
    </div>

    <div class="status-log" id="statusLog">准备就绪：咖啡热气腾腾，随时准备用算力降温</div>
  </div>

  <script>
    let temp = 94.00;
    let cooling = false;
    let timer = null;
    const tempVal = document.getElementById('tempVal');
    const fanIcon = document.getElementById('fanIcon');
    const btnCool = document.getElementById('btnCool');
    const btnBlow = document.getElementById('btnBlow');
    const statusLog = document.getElementById('statusLog');

    btnCool.addEventListener('click', () => {
      if (cooling) return;
      cooling = true;
      btnCool.disabled = true;
      fanIcon.classList.add('fan-spinning');
      statusLog.textContent = "已向显卡派发 100,000 个复杂流体张量，散热风扇疯狂咆哮中...";

      timer = setInterval(() => {
        temp -= 0.01;
        tempVal.textContent = temp.toFixed(2);
      }, 800);

      setTimeout(() => {
        clearInterval(timer);
        cooling = false;
        btnCool.disabled = false;
        fanIcon.classList.remove('fan-spinning');
        statusLog.textContent = "降温已结束！耗电 24%，咖啡杯温成功下降 0.03°C！";
        alert("🎉 经过 30 秒的显卡咆哮降温，您的咖啡温度已达到 93.97°C！\n\n温馨提示：依然会烫破您的舌头，建议还是用嘴吹一吹。");
      }, 4000);
    });

    btnBlow.addEventListener('click', () => {
      temp = 60.00;
      tempVal.textContent = "60.00";
      statusLog.textContent = "物理嘴吹成功！无需任何算力，温度瞬间适宜饮用。";
    });
  </script>
</body>
</html>
